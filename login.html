<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Zero Trust</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="animate-fade-in">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Secure Zero Trust Login</p>
        </div>
        
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        
        {% if message %}
        <div class="alert alert-success">{{ message }}</div>
        {% endif %}
        
        <form method="POST" id="loginForm">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            
            <!-- Hidden Device Fingerprint -->
            <input type="hidden" name="device_fp" id="device_fp">
            
            <button type="submit" class="btn btn-primary">Authenticate</button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="text-sm text-muted">Back to Portal</a>
        </div>
    </div>

    <script>
        // Simple Device Fingerprint Simulation
        const fp = navigator.userAgent + screen.width + "x" + screen.height + new Date().getTimezoneOffset();
        // Simple hash
        let hash = 0;
        for (let i = 0; i < fp.length; i++) {
            hash = ((hash << 5) - hash) + fp.charCodeAt(i);
            hash |= 0;
        }
        document.getElementById('device_fp').value = Math.abs(hash).toString(16);
    </script>
</body>
</html>
