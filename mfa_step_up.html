<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step-up Authentication | Zero Trust</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container" style="max-width: 450px; margin-top: 5rem; text-align: center;">
    <div style="background:#1e293b; padding: 2rem; border-radius: 1rem; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
        <div style="color: #6366f1; font-size: 3rem; margin-bottom: 1rem;">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Step-up Authentication</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem;">
            Accessing <strong>{{ resource }}</strong> requires additional verification due to your current risk profile.
        </p>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.1); color: #fca5a5; padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1.5rem; font-size: 0.85rem; border: 1px solid rgba(239, 68, 68, 0.2);">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('mfa_step_up') }}" method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div style="margin-bottom: 1.5rem;">
                <label for="code" style="display: block; color: #94a3b8; font-size: 0.8rem; margin-bottom: 0.5rem; text-align: left;">Enter 6-digit MFA Code</label>
                <input type="text" name="code" id="code" required autofocus maxlength="6" pattern="\d{6}"
                       style="width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 0.5rem; font-size: 1.25rem; letter-spacing: 0.5rem; text-align: center;">
            </div>
            <button type="submit" style="width: 100%; padding: 0.75rem; background: #6366f1; color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: background 0.2s;">
                Verify Identity
            </button>
        </form>
        
        <div style="margin-top: 1.5rem;">
            <a href="{{ url_for('dashboard') }}" style="color: #64748b; font-size: 0.8rem; text-decoration: none;">Cancel and Return to Dashboard</a>
        </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
